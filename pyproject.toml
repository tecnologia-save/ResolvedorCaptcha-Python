[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ResolvedorCaptcha"
# VERSAO E PARTE DA CORRECAO, nao formalidade. O agente do AutoHub roda
# `pip install -r requirements.txt` sem `--upgrade`: com a versao inalterada, o
# pip considera o pacote ja satisfeito e MANTEM o antigo, por mais que o SHA do
# pin mude. Foi assim que o freshness guard nao chegou ao Edge. Mudou codigo
# aqui, sobe o PATCH.
version = "1.0.5"
description = "Resolvedor de hCaptcha via Gemini — usado pelas bibliotecas de login"
requires-python = ">=3.10"
# FONTE UNICA das dependencias de runtime.
#
# Quando existe um `[project]`, o setuptools ignora `install_requires` do
# setup.py: campo nao declarado aqui vira campo VAZIO na distribuicao, nao
# "herdado". Foi o que aconteceu ao introduzir este arquivo — o pacote passou a
# ser publicado sem `Requires-Dist`, e uma instalacao limpa ficaria sem
# google-genai e sem Pillow, com o solver caindo nos fallbacks `_GENAI=False` e
# `_PIL=False` em silencio. Manter esta lista alinhada com requirements.txt; ha
# teste que compara as duas.
dependencies = [
    "google-genai>=1.0.0",
    "Pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["resolvedor_captcha*"]

[tool.setuptools.package-data]
resolvedor_captcha = ["prompt.md"]

[dependency-groups]
# Ferramentas de desenvolvimento — NAO sao dependencias de runtime do pacote.
# Instalacao: pip install --group dev   (requer pip >= 25.1)
dev = [
    "ruff>=0.6,<1.0",
    "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# O pacote esta na raiz do repo; sem isto `pytest` direto nao acha
# `resolvedor_captcha` (so `python -m pytest`, que poe o CWD no sys.path).
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
# Sem `select`: conjunto padrao do Ruff instalado, igual ao piloto da Apuracao.
# Ampliar somente com evidencia.
